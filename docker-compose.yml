services:
  opencode-api-gateway:
    build: .
    ports:
      - "${PORT:-10000}:${PORT:-10000}"
    environment:
      PORT: "${PORT:-10000}"
      OPENCODE_SERVER_PORT: "${OPENCODE_SERVER_PORT:-10001}"
      OPENCODE_SERVER_URL: "${OPENCODE_SERVER_URL:-}"
      OPENCODE_SERVER_PASSWORD: "${OPENCODE_SERVER_PASSWORD:-}"
      API_KEY_ENABLED: "${API_KEY_ENABLED:-false}"
      API_KEY: "${API_KEY:-}"
      # API_KEYS_FILE is deliberately NOT forwarded from .env: that file lives on the host, so a value like
      # D:\...\config\.keys is meaningless inside the container. The code default (./config/.keys with the
      # /app working directory) already points at /app/config/.keys, i.e. the mounted ./config directory.
      # To use another in-container path, set it literally here or with `docker run -e API_KEYS_FILE=/app/...`.
      SEARCH_API_KEY: "${SEARCH_API_KEY:-}"
      # Provider keys read by config/opencode.json through {env:VAR} interpolation (optional; the default
      # websearch provider "random" needs none). They must be exported here because opencode serve
      # inherits the gateway process environment.
      OLLAMA_API_KEY: "${OLLAMA_API_KEY:-}"
      TAVILY_API_KEY: "${TAVILY_API_KEY:-}"
      LOG_LEVEL: "${LOG_LEVEL:-info}"
      CONFIG_PATH: "${CONFIG_PATH:-/app/config/config.yaml}"
    volumes:
      # Single mount: config.yaml and opencode.json (OPENCODE_CONFIG_DIR) live in ./config.
      - ./config:/app/config:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
