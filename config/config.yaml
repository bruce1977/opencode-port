# Business defaults, packaged into the image (located via CONFIG_PATH, default ./config/config.yaml)
# Committed to the repository and free of secrets (keys only via environment variables, see AGENTS.md §5)

models:
  # Allow list: a full model name (provider/model) must match one of these regexes to appear in /v1/models;
  # auto also picks at random only from the built-in models that match. An empty list means no filtering.
  allow:
    - '^(?:opencode/(?:big-pickle|(?:deepseek|glm|mimo)-v\d+\.\d+(?:-flash)?-free))$'
  auto:
    exclude: []                               # exclusion list (unavailable / unstable), removed from the auto pool
    fallback: "opencode/big-pickle"           # fallback when the pool is empty (built-in model id, e.g. opencode/flint-40b-free)
  aliases: {
    "big-pickle":"opencode/big-pickle",
    "deepseek-v4.1-flash":"opencode/deepseek-v4.1-flash-free",
  }              # short-name map for built-in models, e.g. { flint: "opencode/flint-40b-free" }

ollama:
  # short name -> ollama/<id>, e.g. { qwen: "ollama/qwen3:4b" }
  # note: the Ollama models themselves must be declared in config/opencode.json, under
  # providers.<OLLAMA_LOCAL_PROVIDER>.models (default id: ollama-local)
  aliases: { "qwen3.5":"ollama-local/qwen3.5:9b" }

web_search:
  # optional explicit default model (aliases supported); when empty, uses the first ollama-local/*, else models.auto.fallback
  model: ""
  synthesize_default: false          # whether that model synthesizes the answer by default

search:
  # fallback search backend: duckduckgo / bing are free and need no key; brave needs SEARCH_API_KEY; custom is a self-hosted gateway
  provider: "duckduckgo"
  base_url: ""             # custom backend base URL
  headers: {}              # custom backend request headers
  top_k: 5                 # default number of results (overridable per API request)
  max_chars_per_page: 4000 # default per-page truncation (overridable per API request)

session:
  ttl_min: 30
